# SPDX-License-Identifier: Apache-2.0
id: stirling-pdf
name: Stirling-PDF
homepage: https://www.stirlingpdf.com
tags: [pdf, documents]
images:
  - match: stirlingtools/stirling-pdf
  - match: ghcr.io/stirling-tools/stirling-pdf
  - match: frooodle/s-pdf
    note: original Docker Hub name, still receives every release
oci_source:
  - https://github.com/Stirling-Tools/Stirling-PDF
version:
  scheme: semver
advisories:
  coverage: full
  github_repos:
    - Stirling-Tools/Stirling-PDF
  cpe:
    - cpe:2.3:a:stirlingpdf:stirling_pdf
    - cpe:2.3:a:stirling:stirling_pdf
  notes: >-
    Variants are -fat and -ultra-lite; latest, latest-fat, latest-ultra-lite and alpha are
    floating. No Maven artifact with OSV entries was found.
exposure_hints:
  default_ports: [8080]
  typical: public
maintainers_of_entry: [bifrost0x]
verified: 2026-11-08
