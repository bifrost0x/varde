# SPDX-License-Identifier: Apache-2.0
id: mysql
name: MySQL
homepage: https://www.mysql.com
tags: [database]
images:
  - match: library/mysql
    note: Docker official image
version:
  scheme: semver
  sources:
    - tag: '^v?(?P<v>\d+\.\d+\.\d+)(?:-(?:alpine|bookworm|bullseye|trixie|noble|jammy|focal|oraclelinux|oracle|debian|slim|ubi|nanoserver|windowsservercore)[a-z0-9.]*)*$'
advisories:
  coverage: limited
  cpe:
    - cpe:2.3:a:oracle:mysql
  notes: >-
    MySQL security fixes are announced in Oracle's quarterly Critical Patch Updates; there are no
    GitHub repository advisories. CVEs are matched via the NVD CPE (oracle:mysql). Tags: 8.4.3,
    8.4.3-oraclelinux9 are pinned; 8, 8.4, lts and latest are floating. Written on 2026-11-12 from
    the project's public facts without a fresh look at the live sources; the CPE, the advisory
    repository and the tag forms are to be confirmed on the next review of this entry.
exposure_hints:
  default_ports: [3306]
  typical: internal
eol: mysql
maintainers_of_entry: [bifrost0x]
verified: 2026-11-12
