# SPDX-License-Identifier: Apache-2.0
id: audiobookshelf
name: Audiobookshelf
homepage: https://www.audiobookshelf.org
tags: [media, audiobooks, podcasts]
images:
  - match: ghcr.io/advplyr/audiobookshelf
  - match: advplyr/audiobookshelf
oci_source:
  - https://github.com/advplyr/audiobookshelf
version:
  scheme: semver
advisories:
  coverage: full
  github_repos:
    - advplyr/audiobookshelf
  cpe:
    - cpe:2.3:a:audiobookshelf:audiobookshelf
  notes: >-
    Repository advisories name the package inconsistently (audiobookshelf, Audiobookshelf,
    FileSystemController.js or none), so no package filter is set. A few advisories also list the
    mobile app audiobookshelf-app, whose 0.x ranges never cover server versions. No OSV package
    (npm audiobookshelf has no records). Tags are plain semver (2.37.2); latest, edge and v3 are
    floating.
exposure_hints:
  default_ports: [80]
  typical: public
maintainers_of_entry: [bifrost0x]
verified: 2026-11-09
