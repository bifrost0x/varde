# SPDX-License-Identifier: Apache-2.0
id: n8n
name: n8n
homepage: https://n8n.io
tags: [automation, workflows]
images:
  - match: n8nio/n8n
  - match: docker.n8n.io/n8nio/n8n
    note: registry endpoint recommended in the n8n docs, redirects to the Docker Hub repository
  - match: ghcr.io/n8n-io/n8n
oci_source:
  - https://github.com/n8n-io/n8n
version:
  scheme: semver
advisories:
  coverage: full
  github_repos:
    - n8n-io/n8n
  osv_packages:
    - {ecosystem: npm, name: n8n}
    - {ecosystem: npm, name: n8n-nodes-base}
  cpe:
    - cpe:2.3:a:n8n:n8n
  notes: >-
    Release tags are plain semver with optional -<commit>, -pc and -amd64/-arm64 suffixes;
    nightly, v3-nightly and branch-* tags are floating or development builds.
exposure_hints:
  default_ports: [5678]
  typical: public
maintainers_of_entry: [bifrost0x]
verified: 2026-11-08
