# SPDX-License-Identifier: Apache-2.0
id: mariadb
name: MariaDB
homepage: https://mariadb.org
tags: [database]
images:
  - match: library/mariadb
    note: Docker official image
version:
  scheme: semver
  sources:
    - tag: '^v?(?P<v>\d+\.\d+\.\d+)(?:-[a-z][a-z0-9.]*)*$'
advisories:
  coverage: limited
  cpe:
    - cpe:2.3:a:mariadb:mariadb
  notes: >-
    MariaDB lists the CVEs fixed in each release at https://mariadb.com/kb/en/security/; it has no
    GitHub repository advisories. CVEs are matched via the NVD CPE. Tags: 11.4.3, 11.4.3-noble are
    pinned; 11, 11.4, lts and latest are floating. Written on 2026-11-12 from the project's public
    facts without a fresh look at the live sources; the CPE, the advisory repository and the tag
    forms are to be confirmed on the next review of this entry.
exposure_hints:
  default_ports: [3306]
  typical: internal
eol: mariadb
maintainers_of_entry: [bifrost0x]
verified: 2026-11-12
