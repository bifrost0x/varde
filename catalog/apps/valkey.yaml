# SPDX-License-Identifier: Apache-2.0
id: valkey
name: Valkey
homepage: https://valkey.io
tags: [database, cache]
images:
  - match: valkey/valkey
oci_source:
  - https://github.com/valkey-io/valkey
version:
  scheme: semver
  sources:
    - tag: '^v?(?P<v>\d+\.\d+\.\d+)(?:-[a-z][a-z0-9.]*)*$'
advisories:
  coverage: full
  github_repos:
    - valkey-io/valkey
  notes: >-
    Valkey publishes repository security advisories (valkey-io/valkey) with affected and fixed
    versions. Tags: 8.0.1, 8.0.1-alpine, 8.0.1-bookworm are pinned; 8, 8.0, 8-bookworm and latest
    are floating. Written on 2026-11-12 from the project's public facts without a fresh look at the
    live sources; the CPE, the advisory repository and the tag forms are to be confirmed on the next
    review of this entry.
exposure_hints:
  default_ports: [6379]
  typical: internal
maintainers_of_entry: [bifrost0x]
verified: 2026-11-12
