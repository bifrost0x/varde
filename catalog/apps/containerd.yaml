# SPDX-License-Identifier: Apache-2.0
id: containerd
name: containerd
homepage: https://containerd.io
tags: [containers, runtime]
packages:
  # containerd.io from Docker's repositories: "1.7.22-1", "1.7.22-3.1.el9".
  # It bundles runc, whose version the package does not state.
  - {manager: dpkg, name: containerd.io, versioning: upstream, version_pattern: '^(?:\d+:)?(?P<v>\d+\.\d+\.\d+)'}
  - {manager: rpm, name: containerd.io, versioning: upstream, version_pattern: '^(?:\d+:)?(?P<v>\d+\.\d+\.\d+)'}
version:
  scheme: semver
advisories:
  coverage: full
  github_repos:
    - containerd/containerd
  osv_packages:
    - {ecosystem: Go, name: github.com/containerd/containerd}
    - {ecosystem: Go, name: github.com/containerd/containerd/v2}
  cpe:
    - cpe:2.3:a:linuxfoundation:containerd
  notes: >-
    Advisories are published in containerd/containerd and the Go vulnerability database.
exposure_hints:
  default_ports: []
  typical: internal
eol: containerd
maintainers_of_entry: [bifrost0x]
verified: 2026-11-11
