# SPDX-License-Identifier: Apache-2.0
id: memcached
name: Memcached
homepage: https://memcached.org
tags: [cache]
images:
  - match: library/memcached
    note: Docker official image
version:
  scheme: semver
  sources:
    - tag: '^v?(?P<v>\d+\.\d+\.\d+)(?:-[a-z][a-z0-9.]*)*$'
advisories:
  coverage: limited
  cpe:
    - cpe:2.3:a:memcached:memcached
  notes: >-
    Memcached has no GitHub repository advisories; fixes are named in the release notes and CVEs are
    matched via the NVD CPE. Tags: 1.6.31, 1.6.31-alpine are pinned; 1, 1.6, alpine and latest are
    floating. Written on 2026-11-12 from the project's public facts without a fresh look at the live
    sources; the CPE, the advisory repository and the tag forms are to be confirmed on the next
    review of this entry.
exposure_hints:
  default_ports: [11211]
  typical: internal
maintainers_of_entry: [bifrost0x]
verified: 2026-11-12
