# SPDX-License-Identifier: Apache-2.0
id: mongodb
name: MongoDB
homepage: https://www.mongodb.com
tags: [database]
images:
  - match: library/mongo
    note: Docker official image
version:
  scheme: semver
  sources:
    - tag: '^v?(?P<v>\d+\.\d+\.\d+)(?:-[a-z][a-z0-9.]*)*$'
advisories:
  coverage: limited
  cpe:
    - cpe:2.3:a:mongodb:mongodb
  notes: >-
    MongoDB publishes security advisories at
    https://www.mongodb.com/resources/products/capabilities/alerts; there are no GitHub repository
    advisories. CVEs are matched via the NVD CPE. Tags: 8.0.3, 8.0.3-noble are pinned; 8, 8.0 and
    latest are floating. Written on 2026-11-12 from the project's public facts without a fresh look
    at the live sources; the CPE, the advisory repository and the tag forms are to be confirmed on
    the next review of this entry.
exposure_hints:
  default_ports: [27017]
  typical: internal
eol: mongodb
maintainers_of_entry: [bifrost0x]
verified: 2026-11-12
