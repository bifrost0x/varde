# SPDX-License-Identifier: Apache-2.0
id: gitea
name: Gitea
homepage: https://about.gitea.com
tags: [git, forge, devops]
images:
  - match: docker.gitea.com/gitea
  - match: gitea/gitea
version:
  scheme: semver
  sources:
    - tag: '^(?P<v>\d+\.\d+\.\d+(?:-rc\d+)?)(?:-rootless)?$'
advisories:
  coverage: full
  github_repos:
    - go-gitea/gitea
  osv_packages:
    - {ecosystem: Go, name: gitea.dev}
  cpe:
    - cpe:2.3:a:gitea:gitea
  notes: >-
    The image has no labels; the version comes from the tag. docker.gitea.com/gitea and
    gitea/gitea serve the same digests. Version tags are plain semver with an optional -rootless
    suffix (28.3.0, 28.3.0-rootless); release candidates are 1.27.0-rc0. Numbering went from
    1.27.x to 28.0.0. latest, latest-rootless, major and minor tags (28, 28.3) and *-nightly are
    floating. The Go module moved from code.gitea.io/gitea to gitea.dev; the Go vulnerability
    database marks newer entries under code.gitea.io/gitea as affecting every version, so that
    module is not listed.
exposure_hints:
  default_ports: [3000, 22]
  typical: public
maintainers_of_entry: [bifrost0x]
verified: 2026-11-09
