name: data

# Builds the daily data package (ADR 0039, docs/data-package.md) and
# publishes it on the branch "data": the signed package every installation
# reads, plus the builder's store for the next build. The store and the
# counts of the package are signed by the builder with the feed key and
# used by the next build only when that signature holds: the branch is
# writable by more than can sign a package.
#
# The job does nothing until the repository variable DATA_PACKAGE_ENABLED
# is "true". That is set in the key ceremony, together with the secret
# VARDE_FEED_KEY (the private feed key) in the environment "data-package"
# and the trust root in internal/feed/roots/production.json. Limiting that
# environment to the branch main is a repository setting this file cannot
# make: without it, any workflow that names the environment gets the key.
#
# A build that looks broken is refused by the builder; the job then fails
# and the package published before stays.

on:
  schedule:
    - cron: "17 2 * * *"
  # The package carries the catalog and the index, and an installation uses
  # the package's catalog in place of its built-in one. A new catalog entry
  # therefore reaches installations with the next package: build one when
  # the catalog or the index changes on main, not a day later.
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - "index/**"
  workflow_dispatch:
    inputs:
      force:
        description: "Sign although the package shrank a lot (after checking why)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  build:
    # Only from main: a run started on another branch would build and
    # publish that branch's builder, catalog and index.
    if: vars.DATA_PACKAGE_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: data-package
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fetch the published package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published work/cache
          # Exit code 2 means the branch does not exist. Anything else is a
          # failure: treating it as a first build would publish without the
          # earlier trust roots and without the checks against yesterday.
          rc=0
          git ls-remote --exit-code --heads origin data >/dev/null || rc=$?
          case "${rc}" in
            0)
              git fetch --depth 1 origin data
              # More people and tokens can write this branch than can sign.
              # Only plain files are taken from it: no symlinks, nothing
              # executable, no submodules. The builder checks the content.
              if git ls-tree -r FETCH_HEAD | awk '$1 != "100644" { bad = 1; print "unexpected entry: " $0 } END { exit bad }'; then
                git archive FETCH_HEAD | tar -x -C published
              else
                echo "the branch data holds entries that are not plain files; refusing to build from it" >&2
                exit 1
              fi
              ;;
            2)
              echo "no branch data yet: first build"
              ;;
            *)
              echo "could not ask the remote for the branch data (exit ${rc})" >&2
              exit 1
              ;;
          esac
          # The store is published compressed (scripts/publish-data.sh). It
          # is unpacked before its signature can be checked, so the size is
          # capped: a store beyond the cap is dropped and the builder starts
          # cold. A branch from before the compression holds builder.db.
          store_limit=$((2 * 1024 * 1024 * 1024))
          if [[ -f published/cache/builder.db.gz && ! -L published/cache/builder.db.gz ]]; then
            if gzip -dc published/cache/builder.db.gz | head -c "$((store_limit + 1))" > work/cache/builder.db \
              && [[ "$(stat -c %s work/cache/builder.db)" -le "${store_limit}" ]]; then
              :
            else
              echo "the published store does not unpack or is larger than ${store_limit} bytes: starting cold" >&2
              rm -f work/cache/builder.db
            fi
          elif [[ -f published/cache/builder.db && ! -L published/cache/builder.db ]]; then
            cp published/cache/builder.db work/cache/builder.db
          fi
          if [[ -f work/cache/builder.db && -f published/cache/builder.db.sig && ! -L published/cache/builder.db.sig ]]; then
            cp published/cache/builder.db.sig work/cache/builder.db.sig
          fi
      - name: Build, check and sign
        env:
          VARDE_FEED_KEY: ${{ secrets.VARDE_FEED_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force && '-force' || '' }}
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # FORCE is one flag or nothing
          go run ./cmd/packagebuilder -db work/cache/builder.db -previous published/feed -out work/feed ${FORCE} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          scripts/publish-data.sh work
