# SPDX-License-Identifier: Apache-2.0
#
# Edge: builds the image of the branch main and pushes it to GHCR as
# ghcr.io/bifrost0x/varde:edge, on every push to main and on request.
#
# Until the first release exists the same image is also tagged "latest", so
# the project can be installed before a version is cut. From the first
# release on, "latest" belongs to the release workflow and names the newest
# release; this workflow then moves "edge" only.
#
# Nothing goes to Docker Hub from here, and no release is created. The image
# is signed with cosign (keyless, GitHub OIDC) like a release image.
name: edge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  GHCR_IMAGE: ghcr.io/bifrost0x/varde

concurrency:
  group: edge
  cancel-in-progress: true

jobs:
  image:
    # Only from main: a run started on another branch would publish that
    # branch as the image people install.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # cosign keyless signing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the release tags decide who owns "latest"
          persist-credentials: false
      - name: version and tags
        run: |
          set -euo pipefail
          short="$(git rev-parse --short=12 HEAD)"
          tags="${GHCR_IMAGE}:edge"
          if [ -z "$(git tag --list 'v[0-9]*')" ]; then
            tags="${tags},${GHCR_IMAGE}:latest"
          fi
          {
            echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)"
            echo "EDGE_VERSION=edge-${short}"
            echo "EDGE_TAGS=${tags}"
          } >> "$GITHUB_ENV"
          echo "tags: ${tags}" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.EDGE_TAGS }}
          labels: |
            org.opencontainers.image.title=Varde
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/bifrost0x/varde
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERSION=${{ env.EDGE_VERSION }}
            COMMIT=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          sbom: true
          provenance: mode=max
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${GHCR_IMAGE}@${DIGEST}"
          echo "digest: ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
