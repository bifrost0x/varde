version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    labels: [dependencies, go]
    commit-message:
      prefix: deps(go)
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    labels: [dependencies, docker]
    commit-message:
      prefix: deps(docker)
    groups:
      container-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: [dependencies, github-actions]
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
