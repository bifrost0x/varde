#
# Varde agent for a further Docker host. It connects out to the server's
# agent listener and needs no published port.
#
#   1. Create an enrollment token under Connections > Agents on the server.
#   2. Save it:   printf '%s' 'varde-enroll-v1....' > enroll_token && chmod 600 enroll_token
#   3. Set VARDE_SERVER_URL below and VARDE_VERSION (same release as the
#      server) in .env, then run:   docker compose -f compose.agent.yaml up -d
#
# After the first successful start the token is used up; it can be deleted.
name: varde-agent

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      EVENTS: 1
      VERSION: 1
      PING: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [agent-internal]
    read_only: true
    tmpfs: [/run, /tmp]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  agent:
    image: ${VARDE_IMAGE:-bifrost0x/varde}:${VARDE_VERSION:?set VARDE_VERSION to a release, e.g. in .env}
    command: ["agent"]
    environment:
      VARDE_SERVER_URL: https://varde.lan:8443
      VARDE_ENROLL_TOKEN_FILE: /run/secrets/enroll_token
      VARDE_DOCKER_HOST: tcp://socket-proxy:2375
      # VARDE_AGENT_NAME: nas
    secrets: [enroll_token]
    volumes:
      - agent-data:/data # key, certificate and state
    networks: [agent-internal, default]
    healthcheck:
      test: ["CMD", "/varde", "healthcheck", "agent"]
      interval: 5m
      timeout: 5s
      start_period: 2m
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65532:65532"
    restart: unless-stopped

networks:
  agent-internal:
    internal: true

volumes:
  agent-data:

secrets:
  enroll_token:
    file: ./enroll_token
