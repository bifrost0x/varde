# SPDX-License-Identifier: Apache-2.0
#
# Varde server with a read-only Docker socket proxy.
#
#   docker compose up -d
#   docker compose logs varde | grep setup_token   # first login
#
# The image comes from GHCR. Without further settings it is "latest": the
# newest release, and the state of the branch main while no release exists
# (docs/releasing.md). To stay on one version, pin it in a .env next to this
# file; pinning the digest is better still:
#
#   echo VARDE_VERSION=X.Y.Z > .env
#
# VARDE_IMAGE names another registry, for example docker.io/bifrost0x/varde
# (releases only).
name: varde

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      # Read-only access to exactly what Varde needs (docs/configuration.md).
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      EVENTS: 1
      VERSION: 1
      PING: 1
      POST: 0
      # The proxy is reached over IPv4 inside the stack. Without this it also
      # binds IPv6 and does not start on a host whose kernel has IPv6 off.
      DISABLE_IPV6: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [varde-internal]
    read_only: true
    tmpfs: [/run, /tmp]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  varde:
    image: ${VARDE_IMAGE:-ghcr.io/bifrost0x/varde}:${VARDE_VERSION:-latest}
    command: ["server"]
    environment:
      VARDE_DOCKER_HOST: tcp://socket-proxy:2375
      # Domain suffixes reachable from the internet (Traefik routes).
      # VARDE_PUBLIC_DOMAINS: example.com
      # VARDE_BASE_URL: https://varde.example.com
      # This machine's address in your network: ties it to what the network
      # scan finds and is the address agents are told to use.
      # VARDE_HOST_ADDRESS: 192.168.1.10
      # Digests run at this local time (default UTC).
      # TZ: Europe/Berlin
      # Notifications: see docs/configuration.md (ntfy, Gotify, webhook, SMTP).
    volumes:
      - varde-data:/data
    ports:
      - "127.0.0.1:8080:8080" # UI and API; put a TLS reverse proxy in front for other machines
      - "8443:8443"           # agent listener (mTLS, client certificates only); remove when no agents are used
    networks: [varde-internal, default]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65532:65532"
    restart: unless-stopped

networks:
  varde-internal:
    internal: true

volumes:
  varde-data:
