# SPDX-License-Identifier: Apache-2.0
#
# Varde: the server and a read-only Docker socket proxy.
#
# START (nothing in this file has to be changed for it)
#
#   1. Save this file as compose.yaml in an empty folder.
#   2. docker compose up -d
#   3. Open http://<address of this machine>:8080 in a browser, from this
#      machine or any other in your network.
#   4. Varde asks for a one-time setup token. It is in the log:
#        docker compose logs varde | grep setup_token
#
# LATER, IF YOU WANT
#
#   - HTTPS through a reverse proxy: the block "Behind a reverse proxy" below.
#   - Stay on one version instead of "latest": put it in a file .env next to
#     this one, for example   VARDE_VERSION=0.1.0
#     ("latest" is the newest release, and the state of the branch main while
#     no release exists; docs/releasing.md.)
#   - Everything else: docs/configuration.md
name: varde

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      # Read-only access to exactly what Varde needs (docs/configuration.md).
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      EVENTS: 1
      VERSION: 1
      PING: 1
      POST: 0
      # The proxy is reached over IPv4 inside the stack. Without this it also
      # binds IPv6 and does not start on a host whose kernel has IPv6 off.
      DISABLE_IPV6: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [varde-internal]
    read_only: true
    tmpfs: [/run, /tmp]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  varde:
    image: ${VARDE_IMAGE:-ghcr.io/bifrost0x/varde}:${VARDE_VERSION:-latest}
    command: ["server"]
    environment:
      VARDE_DOCKER_HOST: tcp://socket-proxy:2375

      # Your time zone: digests are sent at this local time (default UTC).
      # TZ: Europe/Berlin

      # This machine's address in your network. Optional: it ties "this host"
      # to what the network scan finds and is the address agents are told to
      # use.
      # VARDE_HOST_ADDRESS: 192.168.1.10

      # --- Behind a reverse proxy with HTTPS (Traefik, Caddy, Nginx Proxy
      # Manager, ...) ---
      # Point the proxy at http://<address of this machine>:8080, then remove
      # the "#" in front of the next two lines and set your address.
      # From then on Varde works through the https address only: opened over
      # http://...:8080 it refuses the sign-in and says why.
      # VARDE_BASE_URL: https://varde.example.com
      # VARDE_BEHIND_TLS_PROXY: "true"
      # Optional, for correct client addresses in the audit log. The value is
      # the proxy's address as Varde sees it; Varde's setup page and its
      # overview show the exact line to put here.
      # VARDE_TRUSTED_PROXIES: 192.168.1.2

      # Domain suffixes that are reachable from the internet through your
      # proxy. Containers served under them count as publicly exposed. Leave
      # it out for names that only resolve inside your network.
      # VARDE_PUBLIC_DOMAINS: example.com

      # Notifications (ntfy, Gotify, webhook, SMTP): docs/configuration.md
    volumes:
      - varde-data:/data
    ports:
      # The web interface, plain http, for every machine in your network.
      # On a machine that is reachable from the internet, write
      # "127.0.0.1:8080:8080" instead and put a reverse proxy in front.
      - "8080:8080"
      # Agents connect here (mTLS, client certificates only). Remove the line
      # when you use no agents.
      - "8443:8443"
    networks: [varde-internal, default]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "65532:65532"
    restart: unless-stopped

networks:
  varde-internal:
    internal: true

volumes:
  varde-data:
